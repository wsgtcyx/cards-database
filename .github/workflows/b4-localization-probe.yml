name: B4 localization upstream probe

on:
  push:
    branches:
      - agent/b4-localization-pipeline
    paths:
      - .github/workflows/b4-localization-probe.yml
      - .agents/skills/b4-card-localization/**
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/b4-localization-probe.yml
      - .agents/skills/b4-card-localization/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b4-localization-pipeline
          fetch-depth: 0

      - name: Skip report-only commits
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%s | grep -Fq '[skip b4-probe]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Probe B4 upstreams
        if: steps.guard.outputs.skip != 'true'
        run: |
          node .agents/skills/b4-card-localization/scripts/probe-upstreams.mjs \
            --output meta/pocket-source-reviews/B4.upstream-probe.json

      - name: Commit probe report
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- meta/pocket-source-reviews/B4.upstream-probe.json)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/pocket-source-reviews/B4.upstream-probe.json
          git commit -m "[skip b4-probe] Capture B4 upstream availability"
          git push origin HEAD:agent/b4-localization-pipeline
