name: B4 localization upstream probe

on:
  push:
    branches:
      - agent/b4-localization-pipeline
    paths:
      - .github/workflows/b4-localization-probe.yml
      - .agents/skills/b4-card-localization/**
      - data/Pokémon TCG Pocket/Ruler of the Skies/**
      - meta/pocket-source-reviews/B4.translations.todo.json
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/b4-localization-probe.yml
      - .agents/skills/b4-card-localization/**
      - data/Pokémon TCG Pocket/Ruler of the Skies/**
      - meta/pocket-source-reviews/B4.translations.todo.json
  workflow_dispatch:

concurrency:
  group: b4-localization-probe-agent-b4
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b4-localization-pipeline
          fetch-depth: 0

      - name: Skip report-only commits
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%s | grep -Fq '[skip b4-probe]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Probe B4 upstreams
        if: steps.guard.outputs.skip != 'true'
        run: |
          node .agents/skills/b4-card-localization/scripts/probe-upstreams.mjs \
            --output meta/pocket-source-reviews/B4.upstream-probe.json

      - name: Discover PokeOS B4 assets
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet 'Pillow==11.3.0'
          python .agents/skills/b4-card-localization/scripts/discover-pokeos-set-id.py \
            --min-id 450 \
            --max-id 850 \
            --output meta/pocket-source-reviews/B4.pokeos-discovery.json

      - name: Audit B4 localization coverage
        if: steps.guard.outputs.skip != 'true'
        run: |
          node .agents/skills/b4-card-localization/scripts/audit-b4.mjs \
            --output meta/pocket-source-reviews/B4.localization-audit.json

      - name: Commit generated reports
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- \
            meta/pocket-source-reviews/B4.upstream-probe.json \
            meta/pocket-source-reviews/B4.pokeos-discovery.json \
            meta/pocket-source-reviews/B4.localization-audit.json)" ]]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            meta/pocket-source-reviews/B4.upstream-probe.json \
            meta/pocket-source-reviews/B4.pokeos-discovery.json \
            meta/pocket-source-reviews/B4.localization-audit.json
          git commit -m "[skip b4-probe] Capture B4 source and localization audit"

          git fetch origin agent/b4-localization-pipeline
          git rebase origin/agent/b4-localization-pipeline
          git push origin HEAD:agent/b4-localization-pipeline
