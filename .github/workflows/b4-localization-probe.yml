name: B4 localization upstream probe

on:
  push:
    branches:
      - agent/b4-localization-pipeline
    paths:
      - .github/workflows/b4-localization-probe.yml
      - .agents/skills/b4-card-localization/**
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/b4-localization-probe.yml
      - .agents/skills/b4-card-localization/**

permissions:
  contents: write

jobs:
  probe:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip b4-probe]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b4-localization-pipeline
          fetch-depth: 0

      - name: Probe structured metadata and localized assets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const crypto = require('node:crypto')

          const locales = ['en', 'fr', 'es', 'it', 'de', 'pt-br', 'zh-tw']
          const sampleIds = ['B4-001', 'B4-154', 'B4-233']
          const timeoutMs = 20_000

          async function request(url, method = 'GET') {
            const controller = new AbortController()
            const timeout = setTimeout(() => controller.abort(), timeoutMs)
            try {
              const response = await fetch(url, {
                method,
                headers: {
                  accept: method === 'HEAD' ? '*/*' : 'application/json',
                  'user-agent': 'wsgtcyx/cards-database-b4-probe/1.0',
                },
                signal: controller.signal,
              })
              const result = {
                url,
                method,
                status: response.status,
                ok: response.ok,
                contentType: response.headers.get('content-type'),
                contentLength: response.headers.get('content-length'),
                etag: response.headers.get('etag'),
                cacheControl: response.headers.get('cache-control'),
              }
              if (method !== 'HEAD') {
                const text = await response.text()
                result.bytes = Buffer.byteLength(text)
                result.sha256 = crypto.createHash('sha256').update(text).digest('hex')
                try {
                  const json = JSON.parse(text)
                  result.jsonType = Array.isArray(json) ? 'array' : typeof json
                  result.keys = json && !Array.isArray(json) && typeof json === 'object'
                    ? Object.keys(json).sort()
                    : []
                  result.count = Array.isArray(json) ? json.length : undefined
                  result.sample = json
                } catch {
                  result.bodyPreview = text.slice(0, 500)
                }
              }
              return result
            } catch (error) {
              return { url, method, ok: false, error: `${error.name}: ${error.message}` }
            } finally {
              clearTimeout(timeout)
            }
          }

          const report = {
            schemaVersion: 1,
            setId: 'B4',
            generatedAt: new Date().toISOString(),
            structured: {},
            assets: {},
          }

          for (const locale of locales) {
            report.structured[locale] = {
              pocketAppList: await request(`https://api.pokemontcgpocket.app/v2/${locale}/cards`),
              pocketAppCards: {},
              tcgdexSet: await request(`https://api.tcgdex.net/v2/${locale}/sets/B4`),
              tcgdexCards: {},
            }
            for (const id of sampleIds) {
              report.structured[locale].pocketAppCards[id] = await request(
                `https://api.pokemontcgpocket.app/v2/${locale}/cards/${id}`,
              )
              report.structured[locale].tcgdexCards[id] = await request(
                `https://api.tcgdex.net/v2/${locale}/cards/${id}`,
              )
            }

            report.assets[locale] = {}
            for (const id of sampleIds) {
              const number = id.slice(-3)
              report.assets[locale][id] = await request(
                `https://game.pokemontcgpocket.app/${locale}/tcgp/B4/${number}/high.webp`,
                'HEAD',
              )
            }
          }

          const output = path.join('meta', 'pocket-source-reviews', 'B4.api-probe.json')
          fs.mkdirSync(path.dirname(output), { recursive: true })
          fs.writeFileSync(output, `${JSON.stringify(report, null, 2)}\n`)
          NODE

      - name: Commit probe report
        shell: bash
        run: |
          if git diff --quiet -- meta/pocket-source-reviews/B4.api-probe.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/pocket-source-reviews/B4.api-probe.json
          git commit -m "[skip b4-probe] Capture B4 upstream schema"
          git push origin HEAD:agent/b4-localization-pipeline
