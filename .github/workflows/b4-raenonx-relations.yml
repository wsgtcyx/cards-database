name: B4 RaenonX relation inspection

on:
  push:
    branches:
      - agent/b4-localization-pipeline
    paths:
      - .github/workflows/b4-raenonx-relations.yml
      - .agents/skills/b4-card-localization/scripts/inspect-raenonx-b4-relations.mjs
  workflow_dispatch:

concurrency:
  group: b4-raenonx-relations
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b4-localization-pipeline
          fetch-depth: 0

      - name: Skip report-only commits
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%s | grep -Fq '[skip b4-relations]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect relation objects
        if: steps.guard.outputs.skip != 'true'
        run: |
          node .agents/skills/b4-card-localization/scripts/inspect-raenonx-b4-relations.mjs \
            --output meta/pocket-source-reviews/B4.raenonx-relations.json

      - name: Commit report
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- meta/pocket-source-reviews/B4.raenonx-relations.json)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/pocket-source-reviews/B4.raenonx-relations.json
          git commit -m "[skip b4-relations] Capture B4 master-data relations"
          git fetch origin agent/b4-localization-pipeline
          git rebase origin/agent/b4-localization-pipeline
          git push origin HEAD:agent/b4-localization-pipeline
