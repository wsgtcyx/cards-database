interface:
  display_name: "Sync Pocket Set"
  short_description: "端到端同步并验证一个 Pocket set"
  default_prompt: "Use $sync-pocket-set to add or repair one Pokémon TCG Pocket set across metadata, locales, R2, API, and requested downstream consumers."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
  activation:
    mode: "automatic"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
