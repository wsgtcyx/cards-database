interface:
  display_name: "Add Pocket Translations"
  short_description: "补齐并语义审计 Pocket set 多语言"
  default_prompt: "Use $add-pocket-translations to add or correct reviewed Pokémon TCG Pocket localizations and prove semantic coverage."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
  activation:
    mode: "automatic"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
